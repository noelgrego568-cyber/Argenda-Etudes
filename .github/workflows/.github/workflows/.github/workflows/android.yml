name: Build Agenda Etudes APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AgendaEtudes_source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q AgendaEtudes_source.zip -d extracted
          PROJECT_FILE=$(find extracted -name settings.gradle -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Etudes-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
